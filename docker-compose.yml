services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${SEWA_DB_PASSWORD:?Set SEWA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    environment:
      SEWA_SECRET_KEY: ${SEWA_SECRET_KEY:?Set SEWA_SECRET_KEY in .env}
      SEWA_ADMIN_USERNAME: ${SEWA_ADMIN_USERNAME:?Set SEWA_ADMIN_USERNAME in .env}
      SEWA_ADMIN_PASSWORD: ${SEWA_ADMIN_PASSWORD:?Set SEWA_ADMIN_PASSWORD in .env}
      SEWA_DB_PASSWORD: ${SEWA_DB_PASSWORD:?Set SEWA_DB_PASSWORD in .env}
    expose:
      - "8000"
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    depends_on:
      - db
    environment:
      SEWA_DB_PASSWORD: ${SEWA_DB_PASSWORD:?Set SEWA_DB_PASSWORD in .env}
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # Internal only: the app uses this service to send SMS, but never exposes
    # its inbox or console to portal users.
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
  certbot-www:
  letsencrypt:
